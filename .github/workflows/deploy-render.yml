# Publica en Render cada vez que cambia main.
# Render no recibe los cambios del repositorio por sí solo, así que se le avisa con su Deploy Hook.
# El hook está en el secreto RENDER_DEPLOY_HOOK (Render → soap-candles-os → Settings → Deploy Hook).
name: Desplegar en Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Lanzar despliegue
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::error::Falta el secreto RENDER_DEPLOY_HOOK"; exit 1; fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Despliegue solicitado para ${GITHUB_SHA::7}"

      - name: Esperar a que la web sirva la versión nueva
        run: |
          # index.html cambia en casi todos los despliegues; si no cambia en 10 min, solo avisa.
          before=$(curl -fsS "https://soap-candles-os.onrender.com/?nc=$RANDOM" | sha1sum)
          for i in $(seq 1 40); do
            sleep 15
            now=$(curl -fsS "https://soap-candles-os.onrender.com/?nc=$RANDOM" | sha1sum)
            if [ "$now" != "$before" ]; then echo "Publicado tras $((i*15)) s"; exit 0; fi
          done
          echo "::warning::La página no cambió en 10 minutos (puede ser normal si el cambio no toca index.html). Revisa Events en Render."

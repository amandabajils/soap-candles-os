e-space:nowrap}td,th{padding:15px 17px;border-bottom:1px solid #edf0f2;font-size:14px}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7b8490;background:#f9fafb}tr:last-child td{border:0}.pill{padding:5px 8px;background:#eff2f5;color:#56616d;border-radius:99px;font-size:11px;font-weight:700}.pill.green{color:#245f47;background:#e6f4ec}.pill.orange{color:#8d591e;background:#fff3df}.pill.red{color:#a63838;background:#fcecec}.link{background:none;border:0;text-decoration:underline;color:#27374a;padding:0}.empty{padding:40px;text-align:center;color:#777}.auth{max-width:420px;margin:9vh auto;background:#fff;padding:36px;border-radius:20px;box-shadow:0 15px 70px #1c27321a}.auth h1{font-family:Georgia,serif}.field{display:block;font-size:12px;font-weight:700;color:#5d6875;margin-bottom:13px}.field input,.field select,.field textarea{margin-top:7px}.modalOverlay{position:fixed;inset:0;background:#16202abd;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px}.modal{background:white;max-width:600px;width:100%;padding:28px;border-radius:18px;max-height:90vh;overflow:auto}.modal h2{margin-bottom:22px}.modalFooter{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{background:#fff7e7;border-radius:12px;padding:15px;color:#7a5b2e;margin:14px 0}.info{background:#eaf1f7;border-radius:12px;padding:15px;color:#2f5471;margin:14px 0}.danger{color:#aa3333}.hidden{display:none}.session{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #edf0f2;padding:15px 0}.session:last-child{border:0}.session strong{display:block;margin-bottom:5px}.progress{height:8px;background:#eaedf0;border-radius:10px;overflow:hidden;width:150px;margin-top:8px}.progress div{background:#6c8a79;height:100%}.topbar-mobile{display:none}.calendarDays{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{min-height:106px;border:1px solid #e5e7ea;border-radius:12px;background:white;padding:10px}.day small{color:#69737f}.day .entry{margin-top:7px;padding:6px;background:#e7efe9;color:#325f47;border-radius:6px;font-size:11px;line-height:1.3;cursor:pointer}.dim{opacity:.4}.toast{position:fixed;right:20px;bottom:20px;max-width:430px;z-index:8;padding:14px 18px;border-radius:12px;background:#233547;color:white;box-shadow:0 10px 35px #15253650}.badgecount{background:#ebf0f4;border-radius:20px;padding:7px 11px;font-size:12px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.nav{flex-direction:row;overflow:auto;padding:12px;position:sticky;top:0;z-index:4;align-items:center}.nav .logo{display:none}.nav .sublogo{display:none}.nav button{white-space:nowrap;width:auto}.nav .bottom{display:none}.main{padding:22px}.calendarDays{gap:3px}.day{min-height:80px;padding:5px}}@media(max-width:560px){.grid,.two{grid-template-columns:1fr}.main{padding:18px}.modal{padding:22px}.calendarDays{grid-template-columns:repeat(2,1fr)}.day{min-height:75px}.top h1{font-size:24px}}
</style></head><body><div id="root"></div><script type="module" src="https://stiucnalemcwedlreaux.supabase.co/functions/v1/soap-candles-os-runtime"></script><script type="text/plain">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.80.0/+esm';
const API='https://stiucnalemcwedlreaux.supabase.co', KEY='sb_publishable_CsjtJFk8sLnpjMgVFIrGsg_2E0xIv-3';
const db=createClient(API,KEY);
const root=document.querySelector('#root');
let user=null,profile=null,view='dashboard',sessions=[],reservations=[],instructors=[],attendance=[],reports=[],earnings=[],materials=[],tasks=[],incidents=[],alerts=[],giftCards=[],rates=[],modal=null,busy=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(v||0));
const fmt=d=>new Intl.DateTimeFormat('es-ES',{timeZone:'Europe/Madrid',dateStyle:'medium',timeStyle:'short'}).format(new Date(d));
const day=d=>new Intl.DateTimeFormat('es-ES',{timeZone:'Europe/Madrid',dateStyle:'medium'}).format(new Date(d));
const val=id=>document.getElementById(id)?.value;
const isAdmin=()=>profile?.role==='admin'&&profile?.active;
const notify=(m,error=false)=>{const t=document.createElement('div');t.className='toast';t.style.background=error?'#923b3b':'';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),4500)};
const btn=(label,act,extra='')=>`<button class="btn ${extra}" data-action="${act}">${label}</button>`;
function modalOpen(title,body,footer=''){modal={title,body,footer};renderModal()};function modalClose(){modal=null;document.querySelector('.modalOverlay')?.remove()};
function renderModal(){document.querySelector('.modalOverlay')?.remove();if(!modal)return;document.body.insertAdjacentHTML('beforeend',`<div class="modalOverlay"><div class="modal"><h2>${esc(modal.title)}</h2>${modal.body}<div class="modalFooter">${btn('Cerrar','close','alt')}${modal.footer}</div></div></div>`)};
async function safe(f){try{busy=true;await f();}catch(e){notify(e.message||'Error inesperado',true);console.error(e)}finally{busy=false}};
async function data(){const calls=[['workshop_sessions','sessions'],['reservations','reservations'],['profiles','instructors'],['attendance','attendance'],['session_reports','reports'],['instructor_earnings','earnings'],['materials','materials'],['tasks','tasks'],['incidents','incidents'],['alerts','alerts'],['gift_cards','giftCards'],['instructor_rates','rates']];await Promise.all(calls.map(async([table,name])=>{const {data,error}=await db.from(table).select('*').limit(800);if(error)throw error;({sessions:v=>sessions=v,reservations:v=>reservations=v,instructors:v=>instructors=v,attendance:v=>attendance=v,reports:v=>reports=v,earnings:v=>earnings=v,materials:v=>materials=v,tasks:v=>tasks=v,incidents:v=>incidents=v,alerts:v=>alerts=v,giftCards:v=>giftCards=v,rates:v=>rates=v})[name](data||[])}))}
async function refresh(){if(user&&profile?.active){await data()}render()}
async function init(){const {data:{session}}=await db.auth.getSession();user=session?.user||null;if(user){await loadProfile()}else render()}
async function loadProfile(){let {data:p,error}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error)notify(error.message,true);profile=p||null;if(profile?.active){await data()}render()}
const occ=id=>reservations.filter(r=>r.session_id===id&&r.status==='confirmed').reduce((s,r)=>s+r.seats,0);
const aCount=id=>reservations.filter(r=>r.session_id===id).reduce((s,r)=>s+(attendance.find(a=>a.reservation_id===r.id)?.present_seats||0),0);
const sessionById=id=>sessions.find(s=>s.id===id);
const instrName=id=>instructors.find(x=>x.id===id)?.display_name||'Sin asignar';
const iconStatus=s=>s==='completed'?'green':s==='cancelled'?'red':s==='scheduled'?'green':'orange';
function authScreen(){root.innerHTML=`<div class="auth"><h1>Soap & Candles</h1><div class="sublogo" style="color:#7c8b95;margin:8px 0 30px">OPERATIONS SYSTEM</div><h2>Acceso privado</h2><p>Inicia sesión con tu cuenta del OS. La cuenta de Supabase Dashboard es independiente.</p><label class="field">Correo electrónico<input id="auth-email" type="email" autocomplete="email" placeholder="tu@email.com"></label><label class="field">Contraseña<input id="auth-password" type="password" autocomplete="current-password" placeholder="••••••••"></label><div class="actions">${btn('Entrar','login')}${btn('Crear mi usuario','signup','alt')}</div><p class="muted">Las cuentas nuevas quedan pendientes hasta que se les concedan permisos de forma segura.</p></div>`}
function pendingScreen(){root.innerHTML=`<div class="auth"><h1>Soap & Candles</h1><h2>Cuenta pendiente de activación</h2><p>Usuario: <strong>${esc(user.email)}</strong></p><div class="notice">Para proteger las reservas y los datos de clientes, la primera administradora debe activarse desde la base de datos. No se conceden permisos automáticamente a las cuentas nuevas.</div><div class="actions">${btn('Comprobar activación','refresh')}${btn('Cerrar sesión','logout','alt')}</div><p class="muted">ID de usuario (para activación): <code>${esc(user.id)}</code></p></div>`}
const navItems=[['dashboard','Resumen'],['calendar','Calendario'],['reservations','Reservas'],['instructors','Instructores'],['inventory','Inventario'],['incidents','Incidencias'],['earnings','Remuneraciones'],['giftcards','Tarjetas regalo']];
function layout(content){root.innerHTML=`<div class="layout"><aside class="nav"><div class="logo">Soap & Candles</div><div class="sublogo">OPERATIONS SYSTEM</div>${navItems.filter(([id])=>isAdmin()||['dashboard','calendar','reservations','incidents','earnings'].includes(id)).map(([id,name])=>`<button data-action="nav" data-id="${id}" class="${view===id?'active':''}">${name}</button>`).join('')}<div class="bottom">${esc(profile.display_name||user.email)} · ${isAdmin()?'Administración':'Instructor'}<br><button data-action="logout">Cerrar sesión</button></div></aside><main class="main">${content}</main></div>`}
const header=(title,desc,action='')=>`<div class="top"><div><h1>${title}</h1><div class="muted">${desc}</div></div><div class="actions">${action}</div></div>`;
const empty=t=>`<div class="empty">${t}</div>`;
function dashboard(){let upcoming=sessions.filter(s=>s.status==='scheduled'&&new Date(s.starts_at)>new Date()).sort((a,b)=>a.starts_at.localeCompare(b.starts_at));return header('Panel general','Operaciones de Soap & Candles · Datos reales de Supabase',btn('Actualizar','refresh','outline'))+`<div class="grid"><div class="card"><div class="muted">Próximos talleres</div><div class="metric">${upcoming.length}</div></div><div class="card"><div class="muted">Reservas confirmadas</div><div class="metric">${reservations.filter(r=>r.status==='confirmed').length}</div></div><div class="card"><div class="muted">Plazas futuras</div><div class="metric">${upcoming.reduce((s,x)=>s+occ(x.id),0)}</div></div><div class="card"><div class="muted">Incidencias abiertas</div><div class="metric">${incidents.filter(i=>i.status!=='resolved').length}</div></div></div><div class="section card"><h2>Próximos talleres</h2>${upcoming.length?upcoming.slice(0,8).map(s=>sessionLine(s)).join(''):empty('Todavía no hay talleres programados.')}</div>${!isAdmin()?`<div class="info">Desde el calendario puedes solicitar un taller sin instructor y registrar la asistencia de tus sesiones.</div>`:''}`}
function sessionLine(s){const used=occ(s.id);return `<div class="session"><div><strong>${esc(day(s.starts_at))} · ${esc(fmt(s.starts_at).split(', ').slice(-1)[0])}</strong><span class="muted">${esc(s.title)} · ${esc(instrName(s.instructor_id))}</span><div class="progress"><div style="width:${Math.min(100,used/s.capacity*100)}%"></div></div></div><div><span class="badgecount">${used}/${s.capacity} plazas</span> <span class="pill ${iconStatus(s.status)}">${esc(s.status)}</span> ${btn('Ver','session:'+s.id,'alt')}</div></div>`}
const monthState={year:new Date().getFullYear(),month:new Date().getMonth()};
function calendar(){let {year,month}=monthState;let first=new Date(year,month,1),last=new Date(year,month+1,0).getDate(),offset=(first.getDay()+6)%7;let days=[];for(let k=0;k<offset;k++)days.push(`<div class="day dim"></div>`);for(let d=1;d<=last;d++){let matching=sessions.filter(s=>{let q=new Date(s.starts_at);return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).format(q)===`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`});days.push(`<div class="day"><small>${d}</small>${matching.map(s=>`<div class="entry" data-action="session:${s.id}">${esc(new Intl.DateTimeFormat('es-ES',{timeZone:'Europe/Madrid',hour:'2-digit',minute:'2-digit'}).format(new Date(s.starts_at)))} · ${occ(s.id)}/${s.capacity}</div>`).join('')}</div>`)}let action=isAdmin()?btn('Crear taller','new-session'):'';return header('Calendario','Sesiones y ocupación actual',action)+`<div class="card"><div class="top"><div class="actions">${btn('←','prev-month','alt')}<strong style="padding:10px">${esc(first.toLocaleDateString('es-ES',{month:'long',year:'numeric'}))}</strong>${btn('→','next-month','alt')}</div></div><div class="calendarDays">${days.join('')}</div></div>`}
function reservationPage(){let rows=reservations.filter(r=>isAdmin()||sessions.some(s=>s.id===r.session_id)).sort((a,b)=>b.created_at.localeCompare(a.created_at));return header('Reservas','Reservas registradas por canal',isAdmin()?btn('Nueva reserva pagada','new-reservation'):'')+`<div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Taller</th><th>Plazas</th><th>Canal</th><th>Estado</th>${isAdmin()?'<th>Acción</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.booking_name)}</td><td>${esc(sessionById(r.session_id)?fmt(sessionById(r.session_id).starts_at):'—')}</td><td>${r.seats}</td><td>${esc(r.source)}</td><td><span class="pill ${r.status==='confirmed'?'green':'red'}">${esc(r.status)}</span></td>${isAdmin()?`<td><button class="link" data-action="edit-reservation:${r.id}">Gestionar</button></td>`:''}</tr>`).join('')}</tbody></table>${rows.length?'':empty('Aún no hay reservas registradas.')}</div>`}
function instructorsPage(){return header('Instructores','Miembros con acceso al OS')+`<div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Rol</th><th>Acceso</th><th>Acción</th></tr></thead><tbody>${instructors.map(p=>`<tr><td>${esc(p.display_name||p.id)}</td><td>${esc(p.role)}</td><td>${p.active?'Activo':'Pendiente'}</td><td>${p.role!=='admin'?`<button class="link" data-action="user:${p.id}">Gestionar acceso</button>`:'—'}</td></tr>`).join('')}</tbody></table></div><div class="info">Para incorporar a Victoria o a un instructor, primero debe crear su usuario en la pantalla de acceso. Después podrás activarlo aquí.</div>`}
function inventoryPage(){return header('Inventario','Stock registrado y necesidades de reposición',btn('Añadir material','new-material'))+`<div class="grid">${materials.map(m=>`<div class="card"><h2>${esc(m.name)}</h2><div class="metric">${m.on_hand} <span class="muted">${esc(m.unit)}</span></div><p>Umbral: ${m.reorder_at}</p>${m.on_hand<=m.reorder_at?'<span class="pill orange">Reponer</span>':'<span class="pill green">Disponible</span>'}<div style="margin-top:15px">${btn('Ajustar stock','stock:'+m.id,'alt')}</div></div>`).join('')}</div>${materials.length?'':empty('Añade los materiales iniciales para controlar el stock.')}`}
function incidentsPage(){return header('Incidencias y tareas','Seguimiento de problemas comunicados en talleres')+`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Incidencia</th><th>Prioridad</th><th>Estado</th><th>Seguimiento</th></tr></thead><tbody>${incidents.map(i=>{let task=tasks.find(t=>t.incident_id===i.id);return `<tr><td>${esc(day(i.created_at))}</td><td>${esc(i.description)}</td><td><span class="pill ${i.urgent?'red':''}">${i.urgent?'Urgente':'Normal'}</span></td><td>${esc(i.status)}</td><td>${isAdmin()&&task&&task.status!=='done'?btn('Resolver','resolve:'+i.id,'alt'):esc(task?.status||'—')}</td></tr>`}).join('')}</tbody></table>${incidents.length?'':empty('No hay incidencias registradas.')}</div>`}
function earningsPage(){let show=earnings.filter(e=>isAdmin()||e.instructor_id===user.id);let total=show.reduce((s,e)=>s+Number(e.amount),0);return header('Remuneraciones',isAdmin()?'Liquidaciones por asistencias reales':'Tus remuneraciones por talleres impartidos',isAdmin()?btn('Configurar tarifa','new-rate'):'')+`<div class="grid"><div class="card"><div class="muted">Sesiones registradas</div><div class="metric">${show.length}</div></div><div class="card"><div class="muted">Total acumulado</div><div class="metric">${money(total)}</div></div></div><div class="section tablewrap"><table><thead><tr><th>Fecha</th>${isAdmin()?'<th>Instructor</th>':''}<th>Asistentes reales</th><th>Importe</th><th>Estado</th></tr></thead><tbody>${show.map(e=>`<tr><td>${sessionById(e.session_id)?esc(day(sessionById(e.session_id).starts_at)):'—'}</td>${isAdmin()?`<td>${esc(instrName(e.instructor_id))}</td>`:''}<td>${e.actual_attendees}</td><td>${money(e.amount)}</td><td>${esc(e.state)}</td></tr>`).join('')}</tbody></table>${show.length?'':empty('No hay liquidaciones todavía. Se generarán al aprobar talleres.')}</div>${isAdmin()?`<div class="section card"><h2>Tarifas configuradas</h2>${rates.length?rates.map(r=>`<div class="session">${r.min_attendees}–${r.max_attendees??'∞'} asistentes <strong>${money(r.amount)}</strong></div>`).join(''):empty('Todavía no hay tramos configurados. Añade vuestra tabla real antes de aprobar cierres.')}</div>`:''}`}
function giftCardsPage(){return header('Tarjetas regalo','Seguimiento de ventas y canjes importados desde Shopify')+`<div class="tablewrap"><table><thead><tr><th>Identificador</th><th>Importe inicial</th><th>Estado</th><th>Caducidad</th></tr></thead><tbody>${giftCards.map(g=>`<tr><td>${esc(g.masked_code||g.shopify_id||g.id.slice(0,8))}</td><td>${money(g.original_amount)}</td><td>${esc(g.state)}</td><td>${g.expires_at?esc(day(g.expires_at)):'—'}</td></tr>`).join('')}</tbody></table>${giftCards.length?'':empty('Todavía no está conectada la integración de Shopify.')}</div>`}
function render(){if(!user){authScreen();return}if(!profile?.active){pendingScreen();return}let c=({dashboard,calendar,reservations:reservationPage,instructors:instructorsPage,inventory:inventoryPage,incidents:incidentsPage,earnings:earningsPage,giftcards:giftCardsPage})[view]?.()||dashboard();layout(c);if(modal)renderModal()}
function field(id,label,type='text',value='',more=''){return `<label class="field">${label}<input id="${id}" type="${type}" ${more} value="${esc(value)}" required></label>`}
function choice(id,label,options){return `<label class="field">${label}<select id="${id}">${options.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select></label>`}
function sessionModal(id){let s=sessionById(id);if(!s)return;const res=reservations.filter(r=>r.session_id===id&&r.status==='confirmed');let already=reports.find(x=>x.session_id===id);const manage=isAdmin();modalOpen(fmt(s.starts_at),`<div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><div class="muted">Plazas reservadas</div><div class="metric">${occ(id)}/${s.capacity}</div></div><div class="card"><div class="muted">Asistentes registrados</div><div class="metric">${aCount(id)}</div></div></div><p>Instructor: ${esc(instrName(s.instructor_id))} · Estado: ${esc(s.status)}</p>${manage?`<label class="field">Asignar instructor<select id="session-instructor"><option value="">Sin asignar</option>${instructors.filter(x=>x.role==='instructor'&&x.active).map(p=>`<option value="${p.id}" ${s.instructor_id===p.id?'selected':''}>${esc(p.display_name)}</option>`).join('')}</select></label>`:!s.instructor_id?btn('Impartir este taller','claim:'+s.id):''}<h2 style="margin-top:20px">Asistencia por reserva</h2>${res.length?res.map(r=>`<div class="session"><div><strong>${esc(r.booking_name)}</strong><span class="muted">${r.seats} plazas reservadas</span></div>${!already&&s.status!=='completed'?`<input style="width:85px" type="number" min="0" max="${r.seats}" value="${attendance.find(a=>a.reservation_id===r.id)?.present_seats??''}" placeholder="Asist." data-attendance="${r.id}"/>`:`<strong>${attendance.find(a=>a.reservation_id===r.id)?.present_seats??'—'} presentes</strong>`}</div>`).join(''):empty('No hay reservas confirmadas.')}<h2 style="margin-top:20px">Cierre de sesión</h2>${already?`<div class="info">Informe ${esc(already.status)} · Vino: ${already.wine_bottles} botellas · Preparado: ${already.setup_ready?'Sí':'No'}</div>`:s.instructor_id===user.id||manage?`${field('wine','Botellas de vino consumidas','number','0','min="0"')}<label><input type="checkbox" id="cleaned" style="width:auto"> Espacio limpio</label><br><label><input type="checkbox" id="prepared" style="width:auto"> Espacio montado para el próximo taller</label><label class="field">Material pendiente o incidencia<textarea id="report-notes" placeholder="Opcional"></textarea></label>`:'<p>El instructor asignado presenta el informe.</p>'}`,`${!already&&s.instructor_id===user.id?btn('Enviar cierre','submit-report:'+id):''}${already&&manage&&already.status==='submitted'?btn('Aprobar cierre','approve-report:'+id):''}${manage?btn('Guardar asignación','assign:'+id,'alt'):''}${!already&&(s.instructor_id===user.id||manage)?btn('Guardar asistencias','save-attendance:'+id,'alt'):''}${s.instructor_id===user.id?btn('Comunicar incidencia','incident:'+id,'outline'):''}`)}
async function createReservation(){const s=val('res-session');let d={session_id:s,booking_name:val('res-name').trim(),seats:Number(val('res-seats')),source:'manual',status:'confirmed',created_by:user.id};if(!d.booking_name||!Number.isInteger(d.seats)||d.seats<1)throw Error('Introduce un cliente y un número válido de plazas');const {data:r,error}=await db.from('reservations').insert(d).select().single();if(error)throw error;const {error:ferr}=await db.from('reservation_financials').insert({reservation_id:r.id,paid_amount:Number(val('res-amount')),payment_method:val('res-method'),paid_at:new Date().toISOString()});if(ferr)throw Error('Reserva creada pero falta registrar el pago: '+ferr.message);modalClose();await refresh();notify('Reserva creada')}
async function saveAttendance(id){for(const input of document.querySelectorAll('[data-attendance]')){if(input.value==='')continue;const r=reservations.find(x=>x.id===input.dataset.attendance);const n=Number(input.value);if(!Number.isInteger(n)||n<0||n>r.seats)throw Error('Asistencia incorrecta');const {error}=await db.from('attendance').upsert({reservation_id:r.id,present_seats:n,recorded_by:user.id,recorded_at:new Date().toISOString()},{onConflict:'reservation_id'});if(error)throw error}notify('Asistencias guardadas');modalClose();await refresh()}
async function reportSend(id){const rs=reservations.filter(r=>r.session_id===id&&r.status==='confirmed');if(rs.some(r=>!attendance.some(a=>a.reservation_id===r.id)))throw Error('Primero registra la asistencia de todas las reservas (incluidos los no presentados).');const s=sessionById(id);const {error}=await db.from('session_reports').insert({session_id:id,instructor_id:s.instructor_id,wine_bottles:Number(val('wine')),cleaned:document.getElementById('cleaned').checked,setup_ready:document.getElementById('prepared').checked,notes:val('report-notes')||null,missing_materials:!document.getElementById('prepared').checked?val('report-notes')||'Montaje pendiente':null});if(error)throw error;modalClose();await refresh();notify('Cierre enviado para revisión')}
function actionMenu(action,id){if(action==='new-session')return modalOpen('Programar taller',`${field('s-title','Nombre','text','Taller de velas y jabones')}<div class="two">${field('s-date','Fecha','date')}${field('s-time','Hora de inicio','time','18:00')}</div><div class="two">${field('s-minutes','Duración (minutos)','number','135','min="30"')}${field('s-cap','Capacidad','number','18','min="1" max="100"')}</div>`,btn('Crear sesión','create-session'));
if(action==='new-reservation')return modalOpen('Reserva manual pagada',`${choice('res-session','Taller',sessions.filter(s=>s.status==='scheduled'&&new Date(s.starts_at)>new Date()).map(s=>[s.id,`${fmt(s.starts_at)} (${s.capacity-occ(s.id)} libres)`]))}${field('res-name','Nombre del cliente')}<div class="two">${field('res-seats','Plazas','number','2','min="1"')}${field('res-amount','Importe ya cobrado (€)','number','','min="0" step="0.01"')}</div>${choice('res-method','Método de pago',[['transfer','Transferencia'],['cash','Efectivo'],['other','Otro']])}<div class="notice">Solo se deben registrar reservas que ya hayan sido pagadas.</div>`,btn('Registrar reserva','create-reservation'));
if(action==='new-rate')return modalOpen('Tarifa por asistentes',`<p>Introduce uno de los tramos reales acordados con la asociación. El importe corresponde al taller completo.</p><div class="two">${field('rate-min','Desde asistentes','number','0','min="0"')}${field('rate-max','Hasta asistentes (vacío = sin límite)','number','18','min="0"')}</div>${field('rate-amount','Importe (€)','number','','min="0" step="0.01"')}`,btn('Guardar tarifa','create-rate'));
if(action==='new-material')return modalOpen('Añadir material',`${field('m-name','Nombre')}${field('m-unit','Unidad (kg, g, unidades, litros…)')}<div class="two">${field('m-stock','Stock inicial','number','0','min="0" step="0.001"')}${field('m-threshold','Nivel mínimo','number','0','min="0" step="0.001"')}</div>${field('m-supplier','Proveedor habitual','text','','')}${field('m-url','Enlace de compra','url','','')}`,btn('Guardar material','create-material'));
if(action==='incident')return modalOpen('Comunicar incidencia',`${choice('inc-type','Tipo de incidencia',[['safety','Seguridad'],['client','Problema con cliente'],['missing_material','Falta de material'],['equipment','Equipo / instalaciones'],['cleaning','Limpieza'],['other','Otra']])}<label class="field">Descripción<textarea id="inc-desc"></textarea></label><div class="muted">La urgencia se determina automáticamente y se crea una tarea de seguimiento.</div>`,btn('Guardar incidencia','create-incident:'+id));
if(action==='edit-reservation'){const r=reservations.find(x=>x.id===id);return modalOpen('Gestionar reserva',`<p><strong>${esc(r.booking_name)}</strong> · ${r.seats} plazas</p><p>Canal: ${esc(r.source)} · Estado: ${esc(r.status)}</p><div class="notice">Los reembolsos no se emiten desde aquí: necesitan autorización y una integración verificada con Shopify.</div>`,r.status==='confirmed'?btn('Marcar cancelada','cancel-reservation:'+id,'outline'):'')}
if(action==='stock')return modalOpen('Ajustar material',`<p>${esc(materials.find(x=>x.id===id)?.name)}</p>${field('stock-count','Nuevo stock disponible','number',materials.find(x=>x.id===id)?.on_hand,'min="0" step="0.001"')}<label class="field">Motivo<textarea id="stock-reason" placeholder="Recepción o ajuste por recuento"></textarea></label>`,btn('Guardar ajuste','save-stock:'+id));
if(action==='user'){const p=instructors.find(x=>x.id===id);return modalOpen('Gestionar usuario',`<p>${esc(p.display_name||p.id)}</p>${choice('u-role','Rol',[['instructor','Instructor'],['pending','Pendiente']])}<label><input type="checkbox" id="u-active" style="width:auto" ${p.active?'checked':''}> Acceso activo</label>`,btn('Guardar permisos','save-user:'+id))}
}
async function doAction(action,id){if(action==='close'){modalClose();return}if(action==='nav'){view=id;modalClose();render();return}if(action==='logout'){await db.auth.signOut();user=null;profile=null;modalClose();render();return}if(action==='refresh'){await loadProfile();notify('Información actualizada');return}if(action==='prev-month'||action==='next-month'){monthState.month+=action==='next-month'?1:-1;if(monthState.month<0){monthState.month=11;monthState.year--}if(monthState.month>11){monthState.month=0;monthState.year++}render();return}if(action==='session')return sessionModal(id);if(['new-session','new-reservation','new-material','incident','edit-reservation','stock','user'].includes(action))return actionMenu(action,id);
if(action==='login'||action==='signup'){const email=val('auth-email'),password=val('auth-password');if(!email||!password)throw Error('Introduce correo y contraseña');let result=action==='signup'?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});if(result.error)throw result.error;if(!result.data.session){notify('Cuenta creada. Confirma tu correo si recibes un mensaje.');return}user=result.data.user;await loadProfile();return}
if(action==='create-session'){const starts=new Date(`${val('s-date')}T${val('s-time')}:00`);if(!Number.isFinite(starts.getTime()))throw Error('Fecha no válida');const {error}=await db.from('workshop_sessions').insert({title:val('s-title'),starts_at:starts.toISOString(),ends_at:new Date(starts.getTime()+Number(val('s-minutes'))*60000).toISOString(),capacity:Number(val('s-cap')),status:'scheduled',created_by:user.id});if(error)throw error;modalClose();await refresh();notify('Taller creado. Aún no se ha publicado en Shopify ni Atrápalo.');return}
if(action==='create-reservation'){await createReservation();return}
if(action==='create-rate'){const min=Number(val('rate-min')),raw=val('rate-max'),max=raw===''?null:Number(raw),amount=Number(val('rate-amount'));if(!Number.isInteger(min)||min<0||(max!==null&&(!Number.isInteger(max)||max<min))||!Number.isFinite(amount)||amount<0)throw Error('Tarifa no válida');if(rates.some(r=>min<=(r.max_attendees??Infinity)&&(max??Infinity)>=r.min_attendees))throw Error('Este tramo se solapa con otro. Revisa las tarifas existentes.');const {error}=await db.from('instructor_rates').insert({min_attendees:min,max_attendees:max,amount});if(error)throw error;modalClose();await refresh();notify('Tarifa guardada');return}
if(action==='create-material'){const {error}=await db.from('materials').insert({name:val('m-name'),unit:val('m-unit'),on_hand:Number(val('m-stock')),reorder_at:Number(val('m-threshold')),supplier_name:val('m-supplier')||null,supplier_url:val('m-url')||null});if(error)throw error;modalClose();await refresh();return}
if(action==='save-stock'){const m=materials.find(x=>x.id===id),newStock=Number(val('stock-count'));if(!Number.isFinite(newStock)||newStock<0)throw Error('Stock inválido');const delta=newStock-Number(m.on_hand);if(delta===0){modalClose();return}const {error}=await db.from('materials').update({on_hand:newStock}).eq('id',id);if(error)throw error;const {error:e2}=await db.from('stock_movements').insert({material_id:id,quantity_change:delta,kind:'adjustment',note:val('stock-reason')||'Ajuste manual',recorded_by:user.id});if(e2)notify('Stock actualizado, pero falta registrar movimiento: '+e2.message,true);modalClose();await refresh();return}
if(action==='save-user'){if(id===user.id)throw Error('No puedes cambiar tus propios permisos');const {error}=await db.from('profiles').update({role:val('u-role'),active:document.getElementById('u-active').checked}).eq('id',id);if(error)throw error;modalClose();await refresh();return}
if(action==='assign'){const {error}=await db.from('workshop_sessions').update({instructor_id:val('session-instructor')||null}).eq('id',id);if(error)throw error;modalClose();await refresh();return}
if(action==='claim'){const {data,error}=await db.rpc('claim_workshop',{p_session_id:id});if(error)throw error;if(!data)throw Error('Este taller ya ha sido asignado');modalClose();await refresh();return}
if(action==='save-attendance'){await saveAttendance(id);return}
if(action==='submit-report'){await reportSend(id);return}
if(action==='approve-report'){const r=reports.find(x=>x.session_id===id);if(!r)throw Error('Informe no encontrado');const count=aCount(id);if(!rates.length)throw Error('Falta configurar la tabla real de remuneraciones. No se puede cerrar el taller sin ella.');const date=day(sessionById(id).starts_at);const rate=rates.find(x=>x.min_attendees<=count&&(x.max_attendees==null||x.max_attendees>=count));if(!rate)throw Error('No existe tarifa para '+count+' asistentes');const {error:e1}=await db.from('session_reports').update({status:'approved',approved_by:user.id,approved_at:new Date().toISOString()}).eq('id',r.id);if(e1)throw e1;const {error:e2}=await db.from('instructor_earnings').upsert({session_id:id,instructor_id:r.instructor_id,actual_attendees:count,amount:Number(rate.amount)},{onConflict:'session_id'});if(e2)throw e2;const {error:e3}=await db.from('workshop_sessions').update({status:'completed',closed_at:new Date().toISOString(),closed_by:user.id}).eq('id',id);if(e3)throw e3;modalClose();await refresh();notify('Taller cerrado y remuneración calculada');return}
if(action==='create-incident'){const {error}=await db.from('incidents').insert({session_id:id,reported_by:user.id,category:val('inc-type'),description:val('inc-desc')});if(error)throw error;modalClose();await refresh();notify('Incidencia registrada y tarea creada');return}
if(action==='resolve'){const task=tasks.find(t=>t.incident_id===id);const {error}=await db.from('incidents').update({status:'resolved',resolved_at:new Date().toISOString()}).eq('id',id);if(error)throw error;if(task)await db.from('tasks').update({status:'done',completed_at:new Date().toISOString()}).eq('id',task.id);await refresh();return}
if(action==='cancel-reservation'){if(!confirm('¿Marcar esta reserva como cancelada en el OS? Esto NO reembolsa ni cancela automáticamente en Shopify o Atrápalo.'))return;const {error}=await db.from('reservations').update({status:'cancelled',updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;modalClose();await refresh();notify('Reserva marcada como cancelada solo en el OS');return}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const [action,...rest]=el.dataset.action.split(':');safe(()=>doAction(action,rest.join(':')||el.dataset.id))});
db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){user=null;profile=null;render()}});
user = { id: 'demo', email: 'demo@local' };
profile = { role: 'admin', active: true, display_name: 'Demo' };
render();
</script></body></html>
